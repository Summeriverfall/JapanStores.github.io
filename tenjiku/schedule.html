<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="カイプ株式会社 / reserveinjp">
  <title>天竺 広東倶楽部 - シフト</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<script src="../brand-banner.js"></script>
<script src="common.js"></script>
<div class="container">
  <a class="back-link" href="portal.html" id="backLink">← 店舗データ</a>
  <header class="header">
    <div>
      <div class="store-badge">天竺 広東倶楽部</div>
      <h1 id="pageTitle">本店シフト</h1>
      <p id="subtitle">マス目をタップして出勤／休を切替。今夜の出勤はホームに出ます。</p>
    </div>
    <div class="language-switcher">
      <button class="lang-btn" type="button" data-lang="ja">日本語</button>
      <button class="lang-btn" type="button" data-lang="zh">中文</button>
      <button class="lang-btn" type="button" data-lang="en">English</button>
    </div>
  </header>
  <section class="data-section" style="overflow-x:auto;">
    <table class="shift-table" id="shiftTable"></table>
    <div class="row" style="margin-top:1rem;">
      <input id="newName" class="input-field" style="min-width:120px">
      <input id="newRole" class="input-field" style="min-width:100px">
      <input id="newHours" class="input-field" value="17–24" style="width:100px">
      <button class="btn" type="button" id="btnAdd">追加</button>
    </div>
  </section>
</div>
<script>
(function () {
  if (!Tenjiku.requireAuth()) return;
  const lang = Tenjiku.getLang();
  const i18n = {
    ja: { back: '← 店舗データ', title: '本店シフト', sub: 'マス目をタップして出勤／休を切替。今夜の出勤はホームに出ます。', days: ['名前', '役割', '時間', '月', '火', '水', '木', '金', '土', '日'], off: '休', add: '追加', name: '名前', role: 'ホール' },
    zh: { back: '← 门店数据', title: '本店排班', sub: '点格子切换出勤／休息。今晚谁上班会显示在首页。', days: ['姓名', '岗位', '时间', '一', '二', '三', '四', '五', '六', '日'], off: '休', add: '添加', name: '姓名', role: '厅面' },
    en: { back: '← Store data', title: 'Shop shifts', sub: 'Tap a cell to toggle on / off. Tonight’s staff shows on home.', days: ['Name', 'Role', 'Hours', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'], off: 'Off', add: 'Add', name: 'Name', role: 'Floor' }
  };
  const t = i18n[lang] || i18n.ja;
  const E = Tenjiku.escapeHtml;
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : lang;
  document.getElementById('backLink').textContent = t.back;
  document.getElementById('pageTitle').textContent = t.title;
  document.getElementById('subtitle').textContent = t.sub;
  document.getElementById('btnAdd').textContent = t.add;
  document.getElementById('newName').placeholder = t.name;
  document.getElementById('newRole').placeholder = t.role;
  Tenjiku.bindLangButtons();

  const uiOrder = [1, 2, 3, 4, 5, 6, 0];
  function paint() {
    const rows = Tenjiku.loadShift();
    let html = '<tr>' + t.days.map(function (d) { return '<th>' + d + '</th>'; }).join('') + '</tr>';
    rows.forEach(function (s, ri) {
      html += '<tr><td>' + E(s.name) + '</td><td>' + E(s.role) + '</td><td>' + E(s.hours || '') + '</td>';
      uiOrder.forEach(function (di) {
        const on = !!(s.days && s.days[di]);
        html += '<td class="' + (on ? 'on-duty' : 'off-duty') + '" data-r="' + ri + '" data-d="' + di + '">' + (on ? E(s.hours || '○') : t.off) + '</td>';
      });
      html += '</tr>';
    });
    document.getElementById('shiftTable').innerHTML = html;
    document.querySelectorAll('#shiftTable td[data-r]').forEach(function (td) {
      td.addEventListener('click', function () {
        const list = Tenjiku.loadShift();
        const r = Number(td.dataset.r);
        const d = Number(td.dataset.d);
        if (!list[r].days) list[r].days = [0, 0, 0, 0, 0, 0, 0];
        list[r].days[d] = list[r].days[d] ? 0 : 1;
        Tenjiku.saveShift(list);
        paint();
      });
    });
  }
  document.getElementById('btnAdd').addEventListener('click', function () {
    const name = document.getElementById('newName').value.trim();
    if (!name) return;
    const list = Tenjiku.loadShift();
    list.push({
      name: name,
      role: document.getElementById('newRole').value.trim() || t.role,
      hours: document.getElementById('newHours').value.trim() || '17–24',
      days: [0, 1, 1, 1, 1, 1, 1]
    });
    Tenjiku.saveShift(list);
    document.getElementById('newName').value = '';
    paint();
  });
  paint();
})();
</script>
</body>
</html>
